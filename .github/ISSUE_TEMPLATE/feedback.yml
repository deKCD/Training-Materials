name: 💬 Training Material Feedback
description: Share feedback on a tutorial, module, or section to help us improve.
title: "[Feedback]: <short summary>"
labels: ["feedback"]
assignees: []
body:
  - type: input
    id: material
    attributes:
      label: Which material are you commenting on?
      description: Path to the tutorial or module. This field is automatically filled in and should not be edited.
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 🏷️ Feedback category 
      description: Choose the area that best fits your feedback.
      options:
        - General feedback
        - Outdated content
        - Clarity or structure
        - Code example issue
        - Missing information
        - Typos or grammar
        - Broken links/images
        - Accessibility
        - Difficulty/prerequisites
        - Examples not reproducible
        - Other
    validations:
      required: true

  - type: textarea
    id: feedback
    attributes:
      label: 📝 Your feedback
      description: Explain what worked well and what could be improved.
      placeholder: "Describe your feedback here..."
    validations:
      required: false

  - type: dropdown
    id: rating
    attributes:
      label: Overall rating (1-5)
      description: Rate your experience with this material
      options:
      - "1 - Did not like at all"
      - "2 - Poor"
      - "3 - Average"
      - "4 - Good"
      - "5 - Very great"
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 💡 Suggested improvement (optional)
      description: If you have a specific idea or example, share it here.
      placeholder: "e.g., Add more examples on X topic..."

  - type: markdown
    attributes:
      value: |
        ✅ **Thanks for helping us improve our training materials!** We appreciate your time and effort in providing feedback.