name: Validate tutorial groups

on:
  push:
    paths:
      - "_tutorials/**"
      - "_data/tutorial_groups.yaml"
  pull_request:
    paths:
      - "_tutorials/**"
      - "_data/tutorial_groups.yaml"

jobs:
  check-tutorial-group:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run tutorial group validator
        run: python bin/tutorial_group_validator.py